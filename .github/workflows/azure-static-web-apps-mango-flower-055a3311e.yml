name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master

env:
  REACT_APP_FUNCTIONS_URL: ${{ secrets.REACT_APP_FUNCTIONS_URL }}
  REACT_APP_GET_EMPLOYEE: ${{ secrets.REACT_APP_GET_EMPLOYEE }}
  REACT_APP_GET_ITEMS: ${{ secrets.REACT_APP_GET_ITEMS }}
  REACT_APP_INSERT_EMAIL: ${{ secrets.REACT_APP_INSERT_EMAIL }}
  REACT_APP_GET_SERVICE_ITEMS: ${{ secrets.REACT_APP_GET_SERVICE_ITEMS }}
  REACT_APP_GET_CATEGORIES_BY_CATEGORY_ID:  ${{ secrets.REACT_APP_GET_CATEGORIES_BY_CATEGORY_ID }}
  REACT_APP_GET_ITEMS_BY_CATEGORY_ID: ${{ secrets.REACT_APP_GET_ITEMS_BY_CATEGORY_ID }}
  REACT_APP_GET_ITEM_BY_ITEM_ID: ${{ secrets.REACT_APP_GET_ITEM_BY_ITEM_ID }}
  REACT_APP_GET_ALL_TEAM_MEMBERS: ${{ secrets.REACT_APP_GET_ALL_TEAM_MEMBERS }}
  REACT_APP_GET_ALL_BLOG_POSTS: ${{ secrets.REACT_APP_GET_ALL_BLOG_POSTS }}
  REACT_APP_UPSERT_BLOG: ${{ secrets.REACT_APP_UPSERT_BLOG }}
  REACT_APP_DELETE_BLOG_POST_BY_ID: ${{ secrets.REACT_APP_DELETE_BLOG_POST_BY_ID }}
  REACT_APP_AUTH0_DOMAIN: ${{ secrets.REACT_APP_AUTH0_DOMAIN }}
  REACT_APP_AUTH0_CLIENT_ID: ${{ secrets.REACT_APP_AUTH0_CLIENT_ID }}
  REACT_APP_UPLOAD_IMAGE: ${{ secrets.REACT_APP_UPLOAD_IMAGE }}
  REACT_APP_YOUTUBE_API_KEY: ${{ secrets.REACT_APP_YOUTUBE_API_KEY }}
  REACT_APP_YOUTUBE_CHANNEL_ID: ${{ secrets.REACT_APP_YOUTUBE_CHANNEL_ID }}
  REACT_APP_UPSERT_CALENDAR_EVENT: ${{ secrets.REACT_APP_UPSERT_CALENDAR_EVENT }}
  REACT_APP_GET_ALL_CALENDAR_EVENTS: ${{ secrets.REACT_APP_GET_ALL_CALENDAR_EVENTS }}
  REACT_APP_DELETE_CALENDAR_EVENT_BY_ID: ${{ secrets.REACT_APP_DELETE_CALENDAR_EVENT_BY_ID }}

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_FLOWER_055A3311E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "build" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_FLOWER_055A3311E }}
          action: "close"
